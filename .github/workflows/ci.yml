name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checks
        if: runner.os != 'Windows'
        run: ./gradlew check --no-daemon --console=plain

      - name: Run checks on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat check --no-daemon --console=plain

      - name: Set up Python for the bundled audio runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify private GStreamer decoders on Linux and macOS
        if: runner.os != 'Windows'
        run: ./gradlew gstreamerTest --no-daemon --max-workers=1 --console=plain

      - name: Verify private GStreamer decoders on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat gstreamerTest --no-daemon --max-workers=1 --console=plain

      # Decoder tests alone do not prove jpackage kept the private libraries in the app bundle on each host.
      - name: Package and verify the default backend on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./gradlew release --no-daemon --max-workers=1 --console=plain
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(find build -path '*/TheSoundboard.app/Contents/app' -type d -print -quit)
          else
            app=$(find build/release -path '*/TheSoundboard/lib/app' -type d -print -quit)
          fi
          test -n "$app"
          cat > "$RUNNER_TEMP/DefaultAudioEngineProbe.java" <<'JAVA'
          import app.audio.AudioEngine;
          import app.audio.AudioEngineMode;
          import app.audio.GstreamerAudioEngine;
          import app.audio.GstreamerRuntime;
          import java.util.List;
          public class DefaultAudioEngineProbe {
              public static void main(String[] args) {
                  AudioEngineMode mode = AudioEngineMode.fromArguments(List.of());
                  if (mode != AudioEngineMode.GSTREAMER) throw new AssertionError(mode);
                  AudioEngine engine = mode.createEngine();
                  if (!(engine instanceof GstreamerAudioEngine)) throw new AssertionError(engine.getClass());
                  engine.shutdown();
                  GstreamerRuntime.shutdown();
                  System.out.println("DEFAULT_GSTREAMER_PACKAGED_RUNTIME_OK");
              }
          }
          JAVA
          javac -cp "$app/*" -d "$RUNNER_TEMP" "$RUNNER_TEMP/DefaultAudioEngineProbe.java"
          java -cp "$RUNNER_TEMP:$app/*" DefaultAudioEngineProbe

      - name: Package and verify the default backend on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat release --no-daemon --max-workers=1 --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Get-ChildItem build/release -Directory -Recurse | Where-Object {
            $_.Name -eq 'app' -and $_.Parent.Name -eq 'TheSoundboard'
          } | Select-Object -First 1 -ExpandProperty FullName
          if (!$app) { throw 'Packaged application JAR directory is missing' }
          @'
          import app.audio.AudioEngine;
          import app.audio.AudioEngineMode;
          import app.audio.GstreamerAudioEngine;
          import app.audio.GstreamerRuntime;
          import java.util.List;
          public class DefaultAudioEngineProbe {
              public static void main(String[] args) {
                  AudioEngineMode mode = AudioEngineMode.fromArguments(List.of());
                  if (mode != AudioEngineMode.GSTREAMER) throw new AssertionError(mode);
                  AudioEngine engine = mode.createEngine();
                  if (!(engine instanceof GstreamerAudioEngine)) throw new AssertionError(engine.getClass());
                  engine.shutdown();
                  GstreamerRuntime.shutdown();
                  System.out.println("DEFAULT_GSTREAMER_PACKAGED_RUNTIME_OK");
              }
          }
          '@ | Set-Content "$env:RUNNER_TEMP/DefaultAudioEngineProbe.java" -Encoding utf8
          javac -cp "$app/*" -d "$env:RUNNER_TEMP" "$env:RUNNER_TEMP/DefaultAudioEngineProbe.java"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp "$env:RUNNER_TEMP;$app/*" DefaultAudioEngineProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified application package
        uses: actions/upload-artifact@v7
        with:
          name: thesoundboard-${{ matrix.os }}
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Preserve native crash and test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            **/hs_err_pid*.log
            build/test-results/
            build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
