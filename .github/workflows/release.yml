name: Release

on:
  pull_request:
    branches:
      - master
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            artifact-path: build/release/*.tar.gz
          - os: windows-latest
            artifact: windows-x64
            artifact-path: build/release/*.zip
          - os: macos-15
            artifact: macos-arm64
            artifact-path: build/release/*.dmg
          - os: macos-15-intel
            artifact: macos-x64
            artifact-path: build/release/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify and package
        if: runner.os != 'Windows'
        run: ./gradlew check release --no-daemon --console=plain

      - name: Verify and package on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat check release --no-daemon --console=plain

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: thesoundboard-${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    # Pull requests build every native package before merge, but never publish a release.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release notes
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Extract version description
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          text = Path("CHANGES.md").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^## ", text)
          matches = [section for section in sections[1:] if re.match(re.escape(version) + r"(?:\s|$)", section)]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one release description for {version}")
          body = matches[0].split("\n", 1)[1].strip()
          if not body or "**Full Changelog**:" not in body:
              raise SystemExit("Release description or changelog link is missing")
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --title "The Soundboard ${RELEASE_TAG#v}"
