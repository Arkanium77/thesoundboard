name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            artifact-path: build/release/*.tar.gz
          - os: windows-latest
            artifact: windows-x64
            artifact-path: build/release/*.zip
          - os: macos-15
            artifact: macos-arm64
            artifact-path: build/release/*.dmg
          - os: macos-15-intel
            artifact: macos-x64
            artifact-path: build/release/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify and package
        if: runner.os != 'Windows'
        run: ./gradlew check release --no-daemon --console=plain

      - name: Verify and package on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat check release --no-daemon --console=plain

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: thesoundboard-${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "The Soundboard ${RELEASE_TAG#v}"
